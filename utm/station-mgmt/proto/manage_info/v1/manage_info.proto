syntax = "proto3";

package manage_info.v1;

option go_package = "github.com/utm/station-mgmt/pkg/pb/mipb";

enum DeviceType {
  DEVICE_TYPE_UNKNOWN = 0;
  DEVICE_TYPE_RADAR = 1;
  DEVICE_TYPE_TDOA = 2;
  DEVICE_TYPE_HUB = 3;
}

enum DeviceStatus {
  DEVICE_STATUS_UNKNOWN = 0;
  DEVICE_STATUS_ONLINE = 1;
  DEVICE_STATUS_OFFLINE = 2;
  DEVICE_STATUS_MAINTENANCE = 3;
}

message Device {
  string id = 1;
  string name = 2;
  DeviceType type = 3;
  double latitude = 4;
  double longitude = 5;
  string address = 6;
  DeviceStatus status = 7;
  int64 created_at = 8; // unix millis
  int64 updated_at = 9;
}

// --- CRUD ---

message CreateDeviceRequest {
  string name = 1;
  DeviceType type = 2;
  double latitude = 3;
  double longitude = 4;
  string address = 5;
}
message CreateDeviceResponse { Device device = 1; }

message GetDeviceRequest { string id = 1; }
message GetDeviceResponse { Device device = 1; }

message UpdateDeviceRequest {
  string id = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  string address = 5;
  DeviceStatus status = 6;
}
message UpdateDeviceResponse { Device device = 1; }

message DeleteDeviceRequest { string id = 1; }
message DeleteDeviceResponse { bool success = 1; }

message ListDevicesRequest {
  int32 page = 1;
  int32 page_size = 2;
  DeviceType type_filter = 3;
  DeviceStatus status_filter = 4;
}
message ListDevicesResponse {
  repeated Device devices = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// --- Summary (dùng bởi management service) ---

message GetSummaryRequest {}

message DeviceGroupSummary {
  int32 total = 1;
  int32 online = 2;
  int32 offline = 3;
  int32 maintenance = 4;
}

// Trả về 3 nhóm riêng biệt: radar, tdoa, hub
message ManageInfoSummary {
  DeviceGroupSummary radar = 1;
  DeviceGroupSummary tdoa = 2;
  DeviceGroupSummary hub = 3;
}

service ManageInfoService {
  rpc CreateDevice(CreateDeviceRequest) returns (CreateDeviceResponse);
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse);
  rpc UpdateDevice(UpdateDeviceRequest) returns (UpdateDeviceResponse);
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc GetSummary(GetSummaryRequest) returns (ManageInfoSummary);
}
